# Settings used ONLY when running tests (mvn test / IntelliJ "Run tests").
# Tests use an in-memory H2 database, so MySQL does not need to be running.
spring.application.name=ADP_Assignment-02-tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
server.servlet.context-path=/adp-assignment
spring.web.resources.static-locations=classpath:/static/
app.default-admin.email=admin@wholesale.local
app.default-admin.password=Admin@123
app.seed-demo-data=false
app.notifications.inactive-customer-days=30
app.security.remember-me-key=test-remember-me-key
