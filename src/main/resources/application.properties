spring.application.name=ADP_Assignment-02

# ---------- Database (local MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/Capstone?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Web server ----------
server.port=8080
server.servlet.context-path=/adp-assignment
# The React app is built into src/main/resources/static (npm run build), so running
# the backend from IntelliJ also serves the latest built frontend at
# http://localhost:8080/adp-assignment/
spring.web.resources.static-locations=classpath:/static/
# Product/customer images are sent as small base64 strings inside the JSON
server.tomcat.max-swallow-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---------- App settings ----------
# Default admin created on first start if there is no admin yet
app.default-admin.email=admin@wholesale.local
app.default-admin.password=Admin@123
# Adds sample products/customers/suppliers ONLY when the database is completely empty
app.seed-demo-data=true
# A customer with no purchases for this many days triggers an "inactive customer" notification
app.notifications.inactive-customer-days=30
# Secret used to sign the "Keep me signed in" (remember-me) cookie - change it for a real deployment
app.security.remember-me-key=stockflow-change-this-secret-key
