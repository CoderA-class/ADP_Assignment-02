spring.application.name=ADP_Assignment-02

# ---------- Database ----------
# Default: your local MySQL (database "Capstone" is created automatically).
# To run without MySQL (Rocco's set-up), set these environment variables in IntelliJ:
#   DB_URL=jdbc:h2:mem:adp_assignment;MODE=MySQL;DB_CLOSE_DELAY=-1  DB_USERNAME=sa  DB_PASSWORD=
#   DB_DRIVER=org.h2.Driver  DB_DIALECT=org.hibernate.dialect.H2Dialect
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Capstone?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.open-in-view=false

# ---------- Web server ----------
server.port=8080
server.servlet.context-path=/adp-assignment
# The React app is built into src/main/resources/static (npm run build), so running
# the backend from IntelliJ also serves the latest built frontend at
# http://localhost:8080/adp-assignment/
spring.web.resources.static-locations=classpath:/static/
# Product/customer images are sent as small base64 strings inside the JSON
server.tomcat.max-swallow-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---------- App settings ----------
# Default admin created on first start if there is no admin yet
app.default-admin.email=admin@wholesale.local
app.default-admin.password=Admin@123
# Adds sample products/customers/suppliers ONLY when the database is completely empty
app.seed-demo-data=true
# A customer with no purchases for this many days triggers an "inactive customer" notification
app.notifications.inactive-customer-days=30
# Secret used to sign the "Keep me signed in" (remember-me) cookie - change it for a real deployment
app.security.remember-me-key=stockflow-change-this-secret-key
